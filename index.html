<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="基于 APQC 新版流程管理成熟度模型（7 原则 × 27 子类别 × 5 级）的在线自评打分平台">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>APQC 流程成熟度自评</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#EAEDE9; --ink:#17212B; --ink-2:#46515C; --muted:#78838D;
  --line:#D6DBD7; --accent:#0E6B63; --accent-ink:#FFFFFF; --accent-soft:#DAECE8; --target:#A8620F; --target-soft:#F6E7D2;
  --l1:#E1EEEB; --l2:#AFD5CE; --l3:#6DB0A5; --l4:#2E897D; --l5:#0B5A52;
  --l1-ink:#17212B; --l2-ink:#17212B; --l3-ink:#0D1B1F; --l4-ink:#FFFFFF; --l5-ink:#FFFFFF;
  --warn:#B4462E; --warn-soft:#F7E1DA;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10161B; --surface:#172027; --surface-2:#1F2A32; --ink:#E5EBEE; --ink-2:#AEB9C1; --muted:#7F8C96;
    --line:#2B3740; --accent:#4FB8AA; --accent-ink:#0B1A1C; --accent-soft:#1B3836; --target:#E3A24E; --target-soft:#3A2C18;
    --l1:#1E3431; --l2:#22514A; --l3:#2C786C; --l4:#46A394; --l5:#86D5C7;
    --l1-ink:#E5EBEE; --l2-ink:#E5EBEE; --l3-ink:#FFFFFF; --l4-ink:#0B1A1C; --l5-ink:#0B1A1C;
    --warn:#E07A61; --warn-soft:#3B2420;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10161B; --surface:#172027; --surface-2:#1F2A32; --ink:#E5EBEE; --ink-2:#AEB9C1; --muted:#7F8C96;
  --line:#2B3740; --accent:#4FB8AA; --accent-ink:#0B1A1C; --accent-soft:#1B3836; --target:#E3A24E; --target-soft:#3A2C18;
  --l1:#1E3431; --l2:#22514A; --l3:#2C786C; --l4:#46A394; --l5:#86D5C7;
  --l1-ink:#E5EBEE; --l2-ink:#E5EBEE; --l3-ink:#FFFFFF; --l4-ink:#0B1A1C; --l5-ink:#0B1A1C;
  --warn:#E07A61; --warn-soft:#3B2420;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.65}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:26px;line-height:1.3}
h2{font-size:20px;line-height:1.35}
h3{font-size:16px;line-height:1.4}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{padding-block:28px 0;display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between}
.brand p{color:var(--ink-2);max-width:62ch;margin-top:6px}
.scorebar{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:110px}
.chip .v{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.2}
.chip .k{font-size:12px;color:var(--muted)}
.chip.stage .v{font-family:var(--serif);font-size:19px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-top:22px;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:12px 16px 11px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}

section.view{padding-top:26px}
.lead{color:var(--ink-2);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.note{font-size:12.5px;color:var(--muted)}

/* sample banner */
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--target-soft);border:1px solid color-mix(in srgb,var(--target) 35%,transparent);border-radius:10px;padding:10px 14px;margin-top:18px}
.banner b{color:var(--target)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* architecture */
.logic{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.lg{border-radius:10px;padding:14px 14px 12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.lg .tag{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.lg h3{font-size:15.5px}
.lg .role{font-size:13px;color:var(--accent);font-weight:500}
.lg .subs{font-size:12.5px;color:var(--ink-2)}
.lg.dir{grid-column:span 4}
.lg.base{grid-column:span 4}
.lg.people{grid-column:span 4}
.lg.loop{grid-column:span 6}
.lg.enable{grid-column:span 12;background:var(--surface-2)}
.layerlab{grid-column:span 12;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:6px}
.layerlab::after{content:"";flex:1;height:1px;background:var(--line)}
.loopnote{grid-column:span 12;font-size:12.5px;color:var(--ink-2);text-align:center;padding:4px 0}
@media (max-width:760px){.lg.dir,.lg.base,.lg.people,.lg.loop{grid-column:span 12}}

.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rung{border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:100%}
.rung .lv{font-family:var(--mono);font-size:12px;opacity:.85}
.rung h3{font-size:15px}
.rung p{font-size:12.5px;line-height:1.6}
@media (max-width:820px){.ladder{grid-template-columns:1fr}}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
th{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
.evo td{min-width:130px}
.evo td:first-child{min-width:110px;font-weight:500}
.evo td .d{display:block;font-size:11.5px;color:var(--muted);font-weight:400}

.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.diff{border-top:2px solid var(--accent);padding-top:10px}
.diff b{font-family:var(--serif);font-size:15px;display:block;margin-bottom:4px}
.diff p{font-size:13px;color:var(--ink-2)}
.mind{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mind div{padding:12px;border-right:1px solid var(--line);background:var(--surface)}
.mind div:last-child{border-right:0}
.mind b{display:block;font-family:var(--serif);font-size:14.5px;margin-bottom:4px}
.mind p{font-size:12.5px;color:var(--ink-2)}
@media (max-width:760px){.mind{grid-template-columns:1fr}.mind div{border-right:0;border-bottom:1px solid var(--line)}}

/* assess */
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select,textarea{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
textarea{min-height:64px;resize:vertical}
.assess{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start;margin-top:18px}
.pnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;flex-direction:column;gap:4px}
.pnav button{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:9px 10px;cursor:pointer}
.pnav button:hover{background:var(--surface)}
.pnav button[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.pnav .idx{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pnav .nm{font-weight:500}
.pnav .pg{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pnav .bar{grid-column:2 / 4;height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.pnav .bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:860px){
  .assess{grid-template-columns:1fr}
  .pnav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .pnav button{min-width:150px}
}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;align-items:flex-start}
.phead .essence{color:var(--ink-2);max-width:66ch;margin-top:6px}
.phead .diffline{margin-top:8px;font-size:13px;color:var(--ink-2)}
.phead .diffline b{color:var(--accent);font-weight:500}
.pscore{display:flex;gap:8px}
.sub{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sub .sh{padding:14px 16px 10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px}
.sub .sh h3{display:flex;gap:10px;align-items:baseline}
.sub .sh h3 .code{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.sub .sh .def{font-size:13px;color:var(--ink-2);flex-basis:100%;max-width:80ch}
.sub .state{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.cur{background:var(--accent-soft);color:var(--accent)}
.pill.tgt{background:var(--target-soft);color:var(--target)}
.pill.none{background:var(--surface-2);color:var(--muted)}
.lvls{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lvl{display:grid;grid-template-columns:86px 1fr 84px;gap:12px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.lvl:last-child{border-bottom:0}
.lvl:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.lvl.on{background:var(--accent-soft)}
.lvl .lb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.lvl .sw{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;flex:none}
.lvl .tx{font-size:13px;color:var(--ink-2);line-height:1.6}
.lvl.on .tx{color:var(--ink)}
.lvl .tx .inf{font-size:11px;color:var(--muted);margin-left:6px;white-space:nowrap}
.lvl .tg{justify-self:end;background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.lvl .tg[aria-pressed="true"]{background:var(--target-soft);border-color:var(--target);color:var(--target);font-weight:500}
.lvl .tg:hover{border-color:var(--target)}
@media (max-width:560px){.lvl{grid-template-columns:1fr auto;}.lvl .tx{grid-column:1 / 3;grid-row:2}.lvl .lb{grid-row:1}}
.sub .nt{padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.sub .nt label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.sub .nt textarea{min-height:40px;background:var(--surface)}
.practice{border-left:3px solid var(--target);padding:4px 0 4px 12px}
.practice b{font-weight:500}
.practice .st{font-size:11.5px;color:var(--target);margin-left:6px}
.practice p{font-size:13px;color:var(--ink-2);margin-top:2px}
.pnext{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.15}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:400}
.kpi .v.serif{font-family:var(--serif);font-size:24px}
.kpi .k{font-size:12px;color:var(--muted);margin-top:4px}
.chartbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--target) 0 4px,transparent 4px 7px)}
.ptable td,.ptable th{white-space:nowrap}
.ptable td.nm{font-weight:500}
.mbar{position:relative;height:10px;background:var(--surface-2);border-radius:5px;min-width:140px}
.mbar .c{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px}
.mbar .t{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--target)}
.gap{color:var(--target);font-weight:600}
.gap.zero{color:var(--muted);font-weight:400}
.lvtag{display:inline-block;border-radius:6px;padding:0 8px;font-size:12px;font-weight:500}
.insight{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight .sev{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;align-self:start;margin-top:2px;white-space:nowrap}
.sev.hi{background:var(--warn-soft);color:var(--warn)}
.sev.md{background:var(--target-soft);color:var(--target)}
.sev.ok{background:var(--accent-soft);color:var(--accent)}
.insight b{font-weight:600}
.insight p{grid-column:2;font-size:13px;color:var(--ink-2)}
.road{display:flex;flex-direction:column;gap:14px}
.rd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.rd .rh{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.rd .rh .path{font-size:13px;color:var(--ink-2)}
.rd .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.rd .cols{grid-template-columns:1fr}}
.rd h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.rd ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.rd li span{color:var(--ink-2)}
.tooltip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--bg);font-size:12px;border-radius:6px;padding:6px 9px;max-width:260px;line-height:1.5}
.dlg{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;z-index:60;padding:16px}
.dlg .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px}
.dlg textarea{min-height:180px;font-family:var(--mono);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:70}
.method{font-size:13px;color:var(--ink-2)}
.method code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 6px;border-radius:4px;color:var(--ink)}
.method li{margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.lvl,.pnav button,.btn{transition:background .15s,border-color .15s}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">APQC Process Management Maturity · 7 原则 × 27 子类别 × 5 级</div>
      <h1>APQC 流程管理成熟度自评</h1>
      <p>依据 APQC 新版流程管理成熟度模型的七大原则拆解评判标准。逐项对照分级描述选定“现状”与“目标”，平台自动计算原则得分、组织整体阶段，并给出短板诊断与进阶路径。</p>
    </div>
    <div class="scorebar" id="scorebar"></div>
  </header>

  <div class="banner" id="sampleBanner" hidden>
    <span><b>当前为示例数据</b>：一家处于“发展阶段”的制造集团的虚拟自评结果，用于展示报告效果，并非真实评估。</span>
    <div class="btnrow"><button class="btn primary" id="startFresh">清空，开始我的评估</button></div>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="model" aria-selected="true"><span class="n">01</span>模型架构与逻辑</button>
    <button role="tab" data-tab="assess" aria-selected="false"><span class="n">02</span>分项打分</button>
    <button role="tab" data-tab="report" aria-selected="false"><span class="n">03</span>诊断报告</button>
    <button role="tab" data-tab="method" aria-selected="false"><span class="n">04</span>计分规则与数据</button>
  </nav>

  <section class="view" id="view-model"></section>
  <section class="view" id="view-assess" hidden></section>
  <section class="view" id="view-report" hidden></section>
  <section class="view" id="view-method" hidden></section>
</div>
<div class="tooltip" id="tip" hidden></div>

<script>
const LEVELS=["初始","发展","标准化","优化","创新"];
const LEVEL_DEF=[
 "无规范化流程，流程均为临时制定；业务成功依赖熟练员工，而非标准化的流程体系。",
 "部分流程和项目实现规范化规划、标准化管理和量化考核；既定准则确保现有实践得以保留，项目按书面计划执行。",
 "大部分流程通过程序、工具和方法实现规范化、明确定义、全员理解并书面记录；在组织内一致执行；结果具备定性可预测性，但缺乏量化保障。",
 "各子流程服务于整体绩效，通过统计和定量技术实施管控；指标基于客户、组织与执行者需求设定；能识别并纠正偏差，绩效可控可预测。",
 "基于对常见变异原因的定量分析持续迭代改进；制定并修订定量改进目标；结合组织整体目标评估效果，由充分授权的团队落地改进。"
];
const SCOPE=["个人 / 临时","部门 / 业务单元","企业统一","端到端 · 量化管控","文化内化 · 外部延伸"];
/* "~" 前缀 = 原文未直接给出，依据该原则演进规律推演的描述 */
const MODEL=[
{id:"SA",name:"战略对齐",layer:"dir",role:"明确方向",

/* ---------- scoring ---------- */
function tgtOf(sc){return sc.t||(sc.c?Math.min(5,sc.c+1):0)}
function principleCalc(p){
  const cs=p.subs.map(s=>state.scores[s.key].c).filter(v=>v>0);
  const ts=p.subs.map(s=>tgtOf(state.scores[s.key])).filter(v=>v>0);
  const done=cs.length, n=p.subs.length;
  if(!done)return{done,n,avg:null,level:null,tavg:null,min:null};
  const avg=cs.reduce((a,b)=>a+b,0)/done;
  const min=Math.min(...cs);
  const level=Math.max(1,Math.min(Math.floor(avg+1e-9),min+1));
  const tavg=ts.length?ts.reduce((a,b)=>a+b,0)/ts.length:null;
  return{done,n,avg,level,tavg,min};
}
function overallCalc(){
  const rows=MODEL.map(p=>({p,...principleCalc(p)}));
  const scored=rows.filter(r=>r.avg!=null);
  const done=rows.reduce((a,r)=>a+r.done,0);
  if(!scored.length)return{rows,done,score:null,stage:null,tscore:null};
  let wsum=0,acc=0,tacc=0;
  scored.forEach(r=>{const w=+state.weights[r.p.id]||0;wsum+=w;acc+=w*r.avg;tacc+=w*(r.tavg||r.avg)});
  const score=wsum?acc/wsum:null, tscore=wsum?tacc/wsum:null;
  const minLv=Math.min(...scored.map(r=>r.level));
  const stage=score==null?null:Math.max(1,Math.min(Math.floor(score+1e-9),minLv+1));
  return{rows,done,score,stage,tscore,minLv};
}

/* ---------- charts ---------- */
function radarSVG(rows){
  const W=460,H=400,cx=230,cy=205,R=150,n=rows.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+R*(v/5)*Math.cos(ang(i)),cy+R*(v/5)*Math.sin(ang(i))];
  let g="";
  for(let k=1;k<=5;k++){const pts=rows.map((_,i)=>pt(i,k).map(x=>x.toFixed(1)).join(",")).join(" ");g+=`<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
    g+=`<text x="${cx+4}" y="${(cy-R*k/5+4).toFixed(1)}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${k}</text>`}
  rows.forEach((r,i)=>{const [x,y]=pt(i,5);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`;
    const [lx,ly]=pt(i,5.9);const anchor=Math.abs(lx-cx)<8?"middle":(lx>cx?"start":"end");
    g+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="12.5" fill="var(--ink)" font-weight="500">${r.p.name}</text>`;
    g+=`<text x="${lx.toFixed(1)}" y="${(ly+19).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${f2(r.avg)} → ${f2(r.tavg)}</text>`});
  const poly=(key,stroke,fill,dash)=>{const pts=rows.map((r,i)=>pt(i,r[key]||0).map(x=>x.toFixed(1)).join(",")).join(" ");return `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="2" ${dash?'stroke-dasharray="5 4"':""} stroke-linejoin="round"/>`};
  g+=poly("tavg","var(--target)","none",true);
  g+=poly("avg","var(--accent)","color-mix(in srgb, var(--accent) 18%, transparent)",false);
  rows.forEach((r,i)=>{if(r.avg==null)return;const [x,y]=pt(i,r.avg);g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" data-tip="${r.p.name}｜现状均分 ${f2(r.avg)}（${lvName(r.level)}）｜目标 ${f2(r.tavg)}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="14" fill="transparent" data-tip="${r.p.name}｜现状均分 ${f2(r.avg)}（${lvName(r.level)}）｜目标 ${f2(r.tavg)}"/>`});
  return `<svg viewBox="-40 -10 ${W+80} ${H+20}" role="img" aria-label="七原则现状与目标雷达图">${g}</svg>`;
}
function profileSVG(){
  const rowH=24,top=30,left=150,right=24,W=640,plotW=W-left-right;
  const items=[];MODEL.forEach(p=>{items.push({head:p});p.subs.forEach(s=>items.push({p,s}))});
  const H=top+items.length*rowH+10;
  const x=v=>left+(v-1)/4*plotW;
  let g="";
  for(let l=1;l<=5;l++){g+=`<line x1="${x(l)}" y1="${top-6}" x2="${x(l)}" y2="${H-6}" stroke="var(--line)"/><text x="${x(l)}" y="${top-12}" text-anchor="middle" font-size="11" fill="var(--muted)">L${l} ${LEVELS[l-1]}</text>`}
  items.forEach((it,i)=>{const y=top+i*rowH+rowH/2;
    if(it.head){g+=`<text x="0" y="${y+4}" font-size="12.5" font-weight="600" fill="var(--ink)">${it.head.name}</text><line x1="0" y1="${y+9}" x2="${W-right}" y2="${y+9}" stroke="var(--line)" stroke-dasharray="2 3"/>`;return}
    const sc=state.scores[it.s.key],t=tgtOf(sc);
    g+=`<text x="12" y="${y+4}" font-size="12" fill="var(--ink-2)">${it.s.n}</text>`;
    if(sc.c&&t>sc.c)g+=`<line x1="${x(sc.c)}" y1="${y}" x2="${x(t)}" y2="${y}" stroke="var(--target)" stroke-width="2" opacity=".55"/>`;
    const tip=`${it.p.name} · ${it.s.n}｜现状 ${lvName(sc.c)}｜目标 ${lvName(t)}${sc.note?"｜"+esc(sc.note):""}`;
    if(t)g+=`<circle cx="${x(t)}" cy="${y}" r="6" fill="var(--surface)" stroke="var(--target)" stroke-width="2"/>`;
    if(sc.c)g+=`<circle cx="${x(sc.c)}" cy="${y}" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
    else g+=`<text x="${x(1)}" y="${y+4}" font-size="11" fill="var(--muted)" text-anchor="middle">未评</text>`;
    g+=`<rect x="0" y="${y-rowH/2}" width="${W}" height="${rowH}" fill="transparent" data-tip="${tip}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="min-width:560px" role="img" aria-label="子类别成熟度剖面">${g}</svg>`;
}

/* ---------- diagnostics ---------- */
function insights(o){
  const a=Object.fromEntries(o.rows.map(r=>[r.p.id,r.avg]));
  if(Object.values(a).some(v=>v==null))return[{sev:"md",t:"评估尚未完成",d:"七个原则都至少完成一个子类别后，才能做跨原则的关联诊断。"}];
  const out=[],mean=o.score;
  const others=id=>{const v=Object.entries(a).filter(([k])=>k!==id).map(([,x])=>x);return v.reduce((s,x)=>s+x,0)/v.length};
  if(a.PP<=2.5&&a.PP<mean)out.push({sev:"hi",t:"量化瓶颈：流程绩效拖住整体进阶",d:`流程绩效均分 ${f2(a.PP)}。APQC 指出，从标准化向优化跨越是最常见的难题，原因往往是没有对流程做量化分析。优化阶段的定义本身要求“通过统计和定量技术实施管控”，绩效不补齐，整体很难越过 L3。`});
  if(a.TT-a.PM>=1)out.push({sev:"hi",t:"技术先行风险：工具领先于流程模型",d:`工具与技术 ${f2(a.TT)} 高出流程模型 ${f2(a.PM)} 一级以上。企业无法自动化自己不理解的流程，技术先导容易导致让流程适配系统、过度采购，或误把系统上线当成流程标准化。`});
  if(a.PG+0.8<=others("PG"))out.push({sev:"hi",t:"治理滞后：责任和规则跟不上",d:`流程治理 ${f2(a.PG)} 明显低于其他原则均值 ${f2(others("PG"))}。治理水平决定流程管理的落地效率、速度和深度；缺少流程所有者与统一方法，其他原则的成果难以保持。`});
  if(a.PM-a.CM>=1)out.push({sev:"md",t:"文档有了，行为没变",d:`流程模型 ${f2(a.PM)} 高于变革管理 ${f2(a.CM)}。流程已被记录，但员工参与、沟通、培训和激励不足，新流程可能停留在纸面。`});
  if(a.SA<=2.2&&a.PI>=2.8)out.push({sev:"md",t:"优化缺少战略牵引",d:`流程优化 ${f2(a.PI)} 较活跃而战略对齐只有 ${f2(a.SA)}。脱离整体战略的优化容易碎片化，单个项目有效，却可能对其他业务环节造成负面影响。`});
  if(a.PI-a.PP>=0.8)out.push({sev:"md",t:"改进缺少证据",d:`流程优化 ${f2(a.PI)} 领先流程绩效 ${f2(a.PP)}。机会筛选和成果验证缺少客观指标，难以证明价值，也难以按价值排序。`});
  if(Math.min(a.SA,a.PG,a.CM)>=2.8&&Math.max(a.PP,a.PI)<=2.3)out.push({sev:"md",t:"架构齐备，闭环未成",d:"方向、治理和变革已有基础，但绩效与优化两项偏弱，流程工作缺少客观目标和持续改进机制，价值难以显现。"});
  const vals=Object.values(a),spread=Math.max(...vals)-Math.min(...vals);
  if(spread>=1.5){const hi=o.rows.reduce((x,y)=>y.avg>x.avg?y:x),lo=o.rows.reduce((x,y)=>y.avg<x.avg?y:x);out.push({sev:"md",t:"原则之间发展不均衡",d:`最强的${hi.p.name}（${f2(hi.avg)}）与最弱的${lo.p.name}（${f2(lo.avg)}）相差 ${spread.toFixed(1)} 分。七项原则相互支撑，整体阶段受最弱原则约束。`})}
  const shorts=[];o.rows.forEach(r=>r.p.subs.forEach(s=>{const c=state.scores[s.key].c;if(c&&r.avg-c>=1)shorts.push(`${r.p.name}·${s.n}（L${c}）`)}));
  if(shorts.length)out.push({sev:"md",t:"原则内部短板",d:`以下子类别比所在原则均分低一级以上，会通过短板约束拉低原则等级：${shorts.join("、")}。`});
  if(!out.length)out.push({sev:"ok",t:"七项原则发展较为均衡",d:"未发现明显的跨原则失衡。进阶重点是按目标等级逐项补齐下一级的判别要点。"});
  return out;
}
function roadmap(r){
  const cur=r.level||1;
  const T=Math.min(5,Math.max(cur+1,Math.round(r.tavg||0)));
  let pr=r.p.practices.filter(x=>x.s>cur&&x.s<=T);
  let early=false;
  if(!pr.length&&cur<5){const nxt=r.p.practices.filter(x=>x.s>cur).sort((a,b)=>a.s-b.s);if(nxt.length){pr=nxt.filter(x=>x.s===nxt[0].s);early=true}}
  if(!pr.length)pr=r.p.practices.filter(x=>x.s<=cur).slice(-1);
  const gaps=r.p.subs.map(s=>{const sc=state.scores[s.key];return{s,c:sc.c,t:tgtOf(sc)}}).filter(x=>x.c&&x.t>x.c).sort((a,b)=>(b.t-b.c)-(a.t-a.c)||a.c-b.c);
  return{cur,T,pr,early,gaps};
}

       <div><h4>对应的 APQC 最佳实践${rm.early?"（提前布局）":""}</h4><ul>${rm.pr.map(x=>`<li><b>${x.t}</b> <span class="note">${LEVELS[x.s-1]}阶段适用</span><br><span>${x.d}</span></li>`).join("")}</ul></div>

  document.getElementById("view-report").innerHTML=`

      <div class="panel chartbox"><div class="eyebrow">七原则现状与目标</div>${radarSVG(o.rows)}
        <div class="legend"><span><i style="background:var(--accent)"></i>现状均分</span><span><i class="dash"></i>目标均分</span></div></div>
      <div class="panel"><div class="eyebrow">关联诊断</div><p class="note" style="margin-top:2px">依据七原则之间的依赖关系自动识别失衡模式</p>
        <div style="margin-top:6px">${ins.map(x=>`<div class="insight"><span class="sev ${x.sev}">${x.sev==="hi"?"重点":x.sev==="md"?"关注":"良好"}</span><b>${x.t}</b><p>${x.d}</p></div>`).join("")}</div></div>
    </div>
    <div>
      <div class="eyebrow">原则得分表</div>
      <div class="tblwrap ptable" style="margin-top:8px"><table>
        <tr><th>原则</th><th>已评</th><th>均分</th><th>原则等级</th><th>现状 · 目标</th><th>目标</th><th>差距</th><th>权重</th></tr>${ptable}</table></div>
      <p class="note" style="margin-top:6px">条形为现状均分，竖线为目标均分。权重默认均为 ×1，可按企业侧重调整，调整后综合得分即时重算。</p>
    </div>
    <div class="panel">
      <div class="eyebrow">子类别成熟度剖面</div>
      <div class="legend" style="margin-bottom:6px"><span><i style="background:var(--accent);height:10px;width:10px;border-radius:50%"></i>现状</span><span><i style="border:2px solid var(--target);height:10px;width:10px;border-radius:50%;background:none"></i>目标</span><span>连线长度 = 需跨越的级数</span></div>
      <div style="overflow-x:auto">${profileSVG()}</div>
    </div>
    <div>
      <div class="eyebrow">进阶路径</div>
      <h2 style="margin-top:2px">下一级要补齐什么</h2>
      <p class="lead" style="margin-top:6px">每个原则列出与目标差距最大的子类别及其下一级判定标准，并匹配 APQC 在对应阶段推荐的最佳实践。</p>
      <div class="road" style="margin-top:12px">${road||`<p class="note">完成打分后生成进阶路径。</p>`}</div>
    </div>
  </div>`;
}

/* ---------- view: method ---------- */
function renderMethod(){
  document.getElementById("view-method").innerHTML=`
  <div class="grid2">
    <div class="panel method">
      <div class="eyebrow">计分规则</div>
      <ol style="padding-left:18px;margin-top:10px">
        <li><b>子类别评分</b>：对照五级描述选定现状等级 1–5。判断标准是“该级描述已在评估范围内普遍、稳定地成立”，局部试点不算达成。</li>
        <li><b>原则均分</b> = 已评子类别的算术平均。</li>
        <li><b>原则等级</b> = <code>min(⌊均分⌋, 最低子类别 + 1)</code>。均分反映整体水平，短板约束防止某个子类别严重落后时被平均值掩盖。</li>
        <li><b>综合得分</b> = 七原则均分按权重加权平均（默认等权）。</li>
        <li><b>整体阶段</b> = <code>min(⌊综合得分⌋, 最弱原则等级 + 1)</code>，与 APQC“七大原则各维度成熟度提升最终推动整体成熟度提升”的逻辑一致。</li>
        <li><b>目标等级</b>：未单独设定时默认取现状 +1，即“下一步最值得补齐的能力”。</li>
      </ol>
      <p class="note" style="margin-top:8px">以上汇总与约束规则是本平台为自评设计的计算方法，不是 APQC 官方计分公式。APQC 官方基准评估请以其正式评估工具为准。</p>
    </div>
    <div class="panel method">
      <div class="eyebrow">评判标准的来源</div>
      <ul style="padding-left:18px;margin-top:10px">
        <li>七大原则、各原则子类别及定义、各原则的五级描述、核心判别维度与分阶段最佳实践，来自 APQC 新版流程管理成熟度模型的中文解读连载（杰成合力科技经 APQC 授权发布，2026 年 8 月，共 7 篇）。</li>
        <li>APQC 原文按原则给出五级描述；本平台把每条描述拆解到对应子类别，并吸收该阶段的最佳实践作为判据。</li>
        <li>原文未覆盖的少数“子类别 × 等级”格子标注为<b>“推演”</b>，按该原则的整体演进规律补齐。</li>
      </ul>
      <div class="eyebrow" style="margin-top:16px">数据保存与迁移</div>
      <p style="margin-top:6px">打分会自动保存在当前浏览器中，换设备或清理浏览器数据后不会保留。需要存档、多人汇总或换设备时，用“导出数据”复制 JSON 文本另存，再用“导入数据”粘贴或选择文件恢复。</p>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn" id="exportJson2">导出数据</button><button class="btn" id="importJson2">导入数据</button>
        <button class="btn" id="loadSample">载入示例</button><button class="btn warn" id="resetAll">清空全部打分</button>
      </div>
    </div>
  </div>`;
}

/* ---------- plumbing ---------- */
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function dialog(html,onMount){const d=document.createElement("div");d.className="dlg";d.innerHTML=`<div class="box">${html}</div>`;document.body.appendChild(d);
  const close=()=>d.remove();d.addEventListener("click",e=>{if(e.target===d||e.target.closest("[data-close]"))close()});onMount&&onMount(d,close);return close}
function copyText(text,okMsg,d){
  const fallback=()=>{if(d){const ta=d.querySelector("textarea");if(ta){ta.focus();ta.select()}}toast("无法直接写入剪贴板，已选中文本，请手动复制")};
  try{navigator.clipboard.writeText(text).then(()=>toast(okMsg),fallback)}catch(e){fallback()}
}
function openExport(){
  const json=JSON.stringify({model:"APQC-PMM-7P-27S",exported:new Date().toISOString(),...state},null,2);
  dialog(`<h3>导出评估数据</h3><p class="note">复制以下 JSON 保存为文本文件，之后可通过“导入数据”恢复。</p><textarea id="exp-ta" readonly>${esc(json)}</textarea><div class="btnrow"><button class="btn primary" id="exp-copy">复制</button><button class="btn" data-close>关闭</button></div>`,
   (d)=>{d.querySelector("#exp-copy").onclick=()=>copyText(json,"已复制评估数据",d)});
}
function openImport(){
  dialog(`<h3>导入评估数据</h3><p class="note">粘贴此前导出的 JSON，或选择保存的文件。导入会覆盖当前打分。</p><textarea id="imp-ta" placeholder="粘贴 JSON"></textarea><input type="file" id="imp-file" accept=".json,.txt,application/json,text/plain"><p class="note" id="imp-err" style="color:var(--warn)"></p><div class="btnrow"><button class="btn primary" id="imp-go">导入并覆盖</button><button class="btn" data-close>取消</button></div>`,
   (d,close)=>{
     d.querySelector("#imp-file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{d.querySelector("#imp-ta").value=r.result};r.readAsText(f)};
     d.querySelector("#imp-go").onclick=()=>{try{const obj=JSON.parse(d.querySelector("#imp-ta").value);if(!obj.scores)throw new Error();
        const s=emptyState();s.meta=Object.assign(s.meta,obj.meta||{});Object.keys(s.scores).forEach(k=>{if(obj.scores[k])s.scores[k]={c:+obj.scores[k].c||0,t:+obj.scores[k].t||0,note:obj.scores[k].note||""}});
        Object.keys(s.weights).forEach(k=>{if(obj.weights&&obj.weights[k]!=null)s.weights[k]=+obj.weights[k]});s.sample=!!obj.sample;state=s;save();close();renderAll();toast("已导入评估数据")}
       catch(err){d.querySelector("#imp-err").textContent="无法识别这段内容。请粘贴从本平台“导出数据”得到的完整 JSON。"}};
   });
}
function confirmBox(msg,okLabel,fn){dialog(`<h3>${msg}</h3><div class="btnrow"><button class="btn warn" id="cf-ok">${okLabel}</button><button class="btn" data-close>取消</button></div>`,(d,close)=>{d.querySelector("#cf-ok").onclick=()=>{fn();close()}})}
function summaryText(){
  const o=overallCalc(),m=state.meta;const lines=[];
  lines.push(`【APQC 流程管理成熟度自评】${m.org||"未命名组织"}${m.date?"（"+m.date+"）":""}`);
  if(m.scope)lines.push(`评估范围：${m.scope}`);
  lines.push(`综合得分 ${f2(o.score)} / 5，整体处于${o.stage?LEVELS[o.stage-1]+"阶段（L"+o.stage+"）":"—"}；目标得分 ${f2(o.tscore)}。`);
  lines.push("各原则：");o.rows.forEach((r,i)=>lines.push(`  ${i+1}. ${r.p.name}：${f2(r.avg)}（${lvName(r.level)}）→ 目标 ${f2(r.tavg)}`));
  lines.push("关联诊断：");insights(o).forEach(x=>lines.push(`  · ${x.t}`));
  return lines.join("\n");
}
function setTab(t){ui.tab=t;saveUi();document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  ["model","assess","report","method"].forEach(v=>document.getElementById("view-"+v).hidden=v!==t);renderView()}
function renderView(){renderHeader();({model:renderModel,assess:renderAssess,report:renderReport,method:renderMethod})[ui.tab]()}
function renderAll(){renderView()}
function afterScoreChange(){if(state.sample){state.sample=false}save();renderView()}

document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b)setTab(b.dataset.tab)});
document.getElementById("startFresh").onclick=()=>{state=emptyState();save();ui.p=0;setTab("assess");toast("已清空，开始新的评估")};

document.addEventListener("click",e=>{
  const tg=e.target.closest(".tg");
  if(tg){e.stopPropagation();const sc=state.scores[tg.dataset.tk],l=+tg.dataset.tl;sc.t=(sc.t===l)?0:l;afterScoreChange();return}
  const lv=e.target.closest(".lvl");
  if(lv){const sc=state.scores[lv.dataset.k],l=+lv.dataset.l;sc.c=(sc.c===l)?0:l;if(sc.t&&sc.t<sc.c)sc.t=0;afterScoreChange();return}
  const pn=e.target.closest(".pnav button");if(pn){ui.p=+pn.dataset.p;saveUi();renderView();return}
  const go=e.target.closest("[data-go]");if(go&&!go.disabled){ui.p=+go.dataset.go;saveUi();renderView();window.scrollTo({top:0});return}
  const tgo=e.target.closest("[data-tabgo]");if(tgo){setTab(tgo.dataset.tabgo);window.scrollTo({top:0});return}
  const id=e.target.id;
  if(id==="exportJson"||id==="exportJson2")openExport();
  if(id==="importJson"||id==="importJson2")openImport();
  if(id==="copySummary"){const t=summaryText();copyText(t,"已复制报告摘要")}
  if(id==="loadSample")confirmBox("载入示例数据会覆盖当前打分，确定吗？","载入示例",()=>{state=sampleState();save();renderView();toast("已载入示例数据")});
  if(id==="resetAll")confirmBox("清空全部打分和评估依据？","清空",()=>{state=emptyState();save();renderView();toast("已清空")});
});
document.addEventListener("keydown",e=>{const lv=e.target.closest&&e.target.closest(".lvl");if(lv&&(e.key==="Enter"||e.key===" ")&&!e.target.closest(".tg")){e.preventDefault();lv.click()}});
document.addEventListener("input",e=>{
  const n=e.target.dataset.note;if(n){state.scores[n].note=e.target.value;save();return}
  const m=e.target.dataset.meta;if(m){state.meta[m]=e.target.value;save();return}
});
document.addEventListener("change",e=>{const w=e.target.dataset.w;if(w){state.weights[w]=+e.target.value;save();renderView()}});
const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(!t){tip.hidden=true;return}
  tip.textContent=t.getAttribute("data-tip").split("｜").join("\n");tip.style.whiteSpace="pre-line";tip.hidden=false;
  const x=Math.min(e.clientX+14,window.innerWidth-270);tip.style.left=x+"px";tip.style.top=(e.clientY+14)+"px"});

setTab(ui.tab);
</script>
</body>
</html>
